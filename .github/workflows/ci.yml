name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest --rootdir . -p no:cacheprovider tests -q
      - run: python -m pytest --rootdir . -p no:cacheprovider source/goal-enforcement/tests -q
      - run: python -m pytest --rootdir . -p no:cacheprovider source/goal/scripts -q
      - run: python -m pytest --rootdir . -p no:cacheprovider source/harness-engineering/scripts -q
      - run: python -m goal_harness validate --root .
