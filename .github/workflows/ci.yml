name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOAL_TEST_GUARD: ${{ github.workspace }}/source/goal-enforcement/scripts/goal_guard.py
      GOAL_TEST_SKILLS_ROOT: ${{ github.workspace }}/source
      GOAL_RUN_GUARD_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest --rootdir . -p no:cacheprovider tests -q
      - run: python -m pytest --rootdir . -p no:cacheprovider source/goal-enforcement/tests -q
      - run: python -m pytest --rootdir . -p no:cacheprovider source/goal/scripts -q
      - run: python -m pytest --rootdir . -p no:cacheprovider source/harness-engineering/scripts -q
      - run: python -m goal_harness validate --root .
      - run: python tools/check_source_integrations.py --root . --online
