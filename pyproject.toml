[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-harness"
version = "0.1.0"
description = "Evidence-first delivery governance for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Goal Harness contributors"}]
keywords = ["ai-agents", "codex", "delivery", "governance", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
goal-harness = "goal_harness.__main__:main"

[tool.setuptools]
packages = ["goal_harness"]
